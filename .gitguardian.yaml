# GitGuardian 설정
#
# 이 저장소에는 운영 자격 증명이 없습니다. 비밀값은 `.env` 에만 두고 커밋하지 않으며
# (`.gitignore` 의 `.env*`), `.env.example` 에는 키 이름만 적습니다. (CLAUDE.md 7장)
#
# 아래 경로의 값은 테스트·seed 전용 가짜 자격 증명입니다. 실제 계정이 아니고 운영
# 환경에서 쓰이지 않습니다. 스캐너가 일반 비밀번호 패턴으로 잡아내므로 제외합니다.
version: 2

secret:
  ignored-paths:
    # 테스트·seed 전용 가짜 비밀번호를 만드는 단일 지점
    - "tests/fixtures/passwords.ts"
    # 가짜 데이터 seed. 자격 증명은 실행 중 표준출력에만 보여 준다
    - "prisma/seed.ts"
    # 통합·E2E 테스트 픽스처
    - "tests/integration/**"
    - "tests/e2e/**"
