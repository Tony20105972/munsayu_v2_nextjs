openapi: 3.1.0
info: {title: Munsayu public/admin API, version: 0.1.0}
paths:
  /api/course-applications:
    post:
      summary: FM-001 강좌 신청
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CourseApplicationInput'}}}}
      responses: {'201': {description: created}, '409': {description: closed}, '422': {description: invalid}}
  /api/event-reservations:
    post:
      summary: FM-002 설명회 예약 (ASM-001)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EventReservationInput'}}}}
      responses: {'201': {description: created}, '409': {description: closed}, '422': {description: invalid}}
  /api/reservations/lookup:
    post:
      summary: PG-011 예약 조회
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReservationLookupInput'}}}}
      responses: {'200': {description: masked reservation summary, headers: {Cache-Control: {schema: {type: string, example: no-store}}}}, '404': {description: not found}, '422': {description: invalid}}
  /api/reservations/{id}/cancel:
    post:
      summary: PG-011 예약 취소
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReservationLookupInput'}}}}
      responses: {'200': {description: cancelled}, '404': {description: not found}, '422': {description: invalid}}
  /api/admin/applications/export:
    get: {summary: AD-013 filtered CSV export with audit record, responses: {'200': {description: csv, headers: {Cache-Control: {schema: {type: string, example: no-store}}}}, '401': {description: unauthenticated}, '403': {description: non-admin forbidden}}}
  /api/admin/privacy/purge:
    post: {summary: AD-013 manual purge, responses: {'200': {description: purge summary and audit id}, '401': {description: unauthenticated}, '403': {description: non-admin forbidden}}}
components:
  schemas:
    CourseApplicationInput:
      type: object
      required: [courseId, studentName, guardianPhone, schoolName, department, grade, privacyConsent, idempotencyKey]
      properties: {courseId: {type: string}, studentName: {type: string}, guardianPhone: {type: string}, schoolName: {type: string}, department: {type: string}, grade: {type: string}, privacyConsent: {const: true}, idempotencyKey: {type: string}}
    EventReservationInput:
      type: object
      required: [eventId, name, phone, grade, attendeeCount, privacyConsent, idempotencyKey]
      properties: {eventId: {type: string}, name: {type: string}, phone: {type: string}, grade: {type: string}, attendeeCount: {type: integer, minimum: 1, maximum: 2}, privacyConsent: {const: true}, idempotencyKey: {type: string}}
    ReservationLookupInput:
      type: object
      required: [reservationId, name, guardianPhone]
      properties: {reservationId: {type: string}, name: {type: string}, guardianPhone: {type: string}}
