# Playwright 공개 관찰 요약 — /sub/Recruit

- 일시: 2026-11-12
- 방법: GET 화면 관찰만; 입력, 파일 선택, 제출 없음.
- 필드: 강사명(실명), 연락처, 이메일 주소, 최종 학력, 논술 강의 총 경력 연수(선택), 강의 가능 전문 분과(복수), 핵심 역량 지표(복수), 한 줄 자기소개, 주요 경력/합격 수치, 첨삭·리라이팅 노하우.
- 첨부: `이력서 및 자기소개서` 필수, 교재·기출 해제안 선택. 화면 문구는 PDF·HWPM·DOCX만 허용.
- 동의: 강사 채용·서류 심사용 개인정보 수집·이용 동의 필수.
- 버튼: `문사유 아카데미 강사 지원서 제출하기`.
